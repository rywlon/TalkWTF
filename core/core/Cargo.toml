[package]
name = "talkwtf-core"
version = "0.9.6"
edition = "2021"
description = "TalkWTF core: settings, ASR, LLM, dictionary, history, learning (no Tauri)"
license = "MIT"

[lib]
name = "talkwtf_core"
crate-type = ["rlib"]

[dependencies]
anyhow = "1.0.95"
chrono = "0.4"
cpal = "0.16.0"
natural = "0.5.0"
rtrb = "0.4.0"
rubato = "0.16.2"
rustfft = "6.4.0"
strsim = "0.11.0"
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
whatlang = "0.16"
log = "0.4.25"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2.3"
flate2 = "1.0"
ferrous-opencc = "0.2.3"
futures-util = "0.3"
hf-hub = { git = "https://github.com/cjpais/hf-hub", branch = "cancellable-downloads", features = [
  "tokio",
] }
once_cell = "1"
sha2 = "0.10"
tar = "0.4.44"
tokio = { version = "1.43.0", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread"] }
handy-keys = "0.3.4"
hound = "3.5.1"
isolang = "2"
earshot = "1.2.2"
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
transcribe-cpp = { version = "0.2.3", default-features = false }
transcribe-rs = { version = "0.3.8", features = ["onnx"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
