[package]
name = "talkwtf-ffi"
version = "0.9.6"
edition = "2021"
description = "C ABI for the TalkWTF Rust core"
license = "MIT"

[lib]
name = "talkwtf_ffi"
# A static library the SwiftUI app links directly.
crate-type = ["staticlib", "cdylib"]

[dependencies]
talkwtf-core = { path = "../core" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.25"
tokio = { version = "1.43.0", features = ["rt-multi-thread"] }
